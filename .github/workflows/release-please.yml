name: release-please

# Conventional-commit driven versioning. On every push to main, release-please
# accumulates the un-released commits and maintains a single open "release PR"
# that bumps the version (feat→minor, fix/perf→patch; pre-1.0 breaking stays in
# 0.x) + updates CHANGELOG.md + bumps cmd/workingbad/main.go's binaryVersion.
# When that PR's required CI is green it auto-merges, cutting a git tag + Release.
#
# Why a fine-grained PAT (secrets.RELEASE_PLEASE_TOKEN) instead of GITHUB_TOKEN:
#   1. the default token can only open PRs when a repo flag is on; and crucially
#   2. a PR opened with GITHUB_TOKEN does NOT trigger CI (the `pull_request`
#      event is suppressed), and a merge performed with GITHUB_TOKEN does NOT
#      cascade to re-run this workflow — so the tag would never be cut. A
#      real-user PAT makes CI run on the release PR and makes the merge
#      re-trigger the tag-cutting step. The PAT is fine-grained, single-repo,
#      Contents:RW + Pull-requests:RW only (least privilege).
#
# DECOUPLED from the schema-freeze marker: release-please owns the v0.x.y tags;
# the `schema-frozen` tag is pushed by hand (see scripts/check-migration-gates.sh)
# once the node model lands.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # When a release PR is open (just created or updated this run), arm
      # auto-merge so it merges itself once the branch-protection required
      # checks pass. Uses the PAT so the eventual merge is attributed to a real
      # user and cascades to re-run this workflow's tag-cutting step.
      # Idempotent — re-arming an already-armed PR is a harmless no-op.
      - name: Arm auto-merge on the release PR
        if: ${{ steps.release.outputs.pr }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          # This job never checks out the repo, so gh can't infer it from a
          # local .git — pass it explicitly or gh errors "not a git repository".
          GH_REPO: ${{ github.repository }}
        run: gh pr merge --auto --squash "${{ fromJSON(steps.release.outputs.pr).number }}"
