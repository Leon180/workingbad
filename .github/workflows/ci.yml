name: CI

on:
  push:
    branches: [ main ]
  pull_request:

# Default-deny: every job below opts in to exactly what it needs. Prevents
# a compromised action from elevating to write access via the default
# GITHUB_TOKEN. Pattern: sigstore/cosign, caddyserver/caddy.
permissions:
  contents: read

jobs:
  build-and-test:
    name: build / vet / test
    runs-on: ubuntu-latest
    steps:
      # All third-party actions pinned to commit SHAs (not tags). Tag
      # re-attribution attacks (e.g. tj-actions/changed-files Mar 2025)
      # become impossible — a published tag CAN be moved, a 40-char SHA
      # cannot. Version comment on the same line for human-readable
      # bookkeeping; Dependabot updates both the SHA and the comment
      # via its `update: pinned-version-comments` behavior.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0  # migration gates need full history for tag diffs

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - run: go mod download
      - run: go vet ./...
      - run: go test -race ./...
      - name: build single binary
        run: go build -o workingbad ./cmd/workingbad

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v7.0.0
        with:
          # action@v7 + v2.x ships with Go 1.25 toolchain; @v6 + `latest`
          # resolves to v1.64.x (Go 1.24, fails on our go.mod).
          version: v2.4.0

  migration-gates:
    name: migration discipline (3 gates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - run: bash scripts/check-migration-gates.sh

  sqlc-diff:
    name: sqlc drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: sqlc-dev/setup-sqlc@c0209b9199cd1cce6a14fc27cabcec491b651761 # v4
        with:
          sqlc-version: '1.21.0'
      - name: verify generated sqlc code matches SQL
        run: sqlc diff

  govulncheck:
    name: govulncheck (Go stdlib + deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      # govulncheck is the Go-team's own scanner. False-positive rate is
      # near zero (it walks the call graph to check whether vulnerable
      # symbols are actually reachable), so any FAIL is real signal.
      - name: install
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: scan
        run: govulncheck ./...

  # dependency-review needs "Dependency Graph" enabled on the repo (a
  # one-click Settings → Code security → "Dependency graph" toggle that
  # the workflow cannot flip for itself). Disabled until the toggle is
  # on; re-enable by removing the `if: false` line below.
  # See: https://github.com/Leon180/workingbad/settings/security_analysis
  dependency-review:
    name: dependency review
    if: false # TODO: enable repo "Dependency graph" setting, then remove
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: true
