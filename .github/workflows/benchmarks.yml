name: Benchmarks

# Issue #28: catch perf regressions before merge.
#
# Strategy:
# - On every push to main: run benchmarks, upload result as artifact
#   `bench-main` (overwrites previous main result).
# - On every PR: download the latest main artifact, run benchmarks on the
#   PR head, compare via benchstat. Fail the check if any benchmark
#   regresses > 5% with statistical significance (p < 0.05).
#
# First-PR-ever bootstrap: when no main artifact exists yet the PR job
# just records its result without comparison. The next main push seeds
# the baseline.
#
# See docs/PERF.md for the local workflow and the reference numbers we
# don't want to regress past.

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  bench:
    name: bench (run + upload)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest

      - name: run benchmarks (10 samples each)
        # -count=10 gives benchstat enough samples for a t-test.
        # -benchtime=2s caps wall time per benchmark; the M5-vs-GHA-runner
        # delta means we tune wall time, not iteration count, to keep CI
        # under ~10min.
        # -run=^$ skips Test* functions (we only want bench data here;
        # the regular test job covers correctness).
        #
        # Stderr (goose migration log) used to interleave with the
        # benchmark output via 2>&1, producing lines like
        #   "BenchmarkInsertEntry-4 ... 2026/06/11 12:37:09 OK 0001_*"
        # which benchstat tries to parse and dies on. Pipe stdout
        # through `tee` so the live CI log shows benchmark progress as
        # it streams AND bench-raw.txt stays stderr-free.
        #
        # Then run the same strict positive filter that regression-check
        # uses, *before* upload, so the artifact itself is benchstat-
        # parseable. Without this the upload happens to a raw file and
        # any older filter mismatch (or contamination class we didn't
        # think of) gets baked into the main baseline, poisoning every
        # subsequent PR check until the baseline rolls. The defensive
        # filter in regression-check stays as belt-and-suspenders for
        # baselines uploaded before this step landed.
        run: |
          go test \
            -bench=. \
            -benchmem \
            -benchtime=2s \
            -count=10 \
            -run=^$ \
            ./internal/repository/ \
            ./internal/web/ \
            ./internal/web/layout/ \
            | tee bench-raw.txt
          FILTER='^(goos:|goarch:|pkg:|cpu:|Benchmark[A-Za-z0-9_/]+-[0-9]+[[:space:]]+[0-9]+[[:space:]]+[0-9]+(\.[0-9]+)?[[:space:]]+ns/op|PASS|FAIL|ok[[:space:]])'
          grep -E "$FILTER" bench-raw.txt > bench.txt
          echo "--- artifact preview (filtered) ---"
          head -30 bench.txt

      - name: upload result as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ github.event_name == 'push' && 'bench-main' || format('bench-pr-{0}', github.event.pull_request.number) }}
          path: bench.txt
          # 30 days is enough — main artifact gets overwritten weekly anyway,
          # and PR artifacts are rarely useful past merge.
          retention-days: 30

      - name: print result to log (always)
        # Redundant when `tee` above succeeds; kept so a `set -e` exit
        # mid-bench still leaves the partial bench.txt visible.
        if: always()
        run: cat bench.txt || true

  regression-check:
    name: "bench: regression check"
    needs: bench
    # Compare only on PRs; main pushes ARE the baseline so there's nothing
    # to compare against.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest

      - name: download PR benchmark result
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bench-pr-${{ github.event.pull_request.number }}
          path: ./pr

      - name: download main baseline
        id: baseline
        # `actions/download-artifact` only sees artifacts of the current
        # workflow run by default. The previous version of this job
        # tried it first (always failed on PRs with a scary
        # ##[error]Unable to download artifact(s): Not Found) and only
        # then ran the gh-api fallback — confusing in the UI. Skip the
        # red herring: go straight through the GitHub API for the
        # latest `bench-main` across all runs of this workflow.
        run: |
          set -euo pipefail
          ARTIFACT_URL=$(gh api \
            "/repos/${{ github.repository }}/actions/artifacts?name=bench-main&per_page=1" \
            --jq '.artifacts[0].archive_download_url // empty')
          if [ -z "$ARTIFACT_URL" ]; then
            echo "::notice::no main baseline artifact found — first PR ever, or main hasn't run yet"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p ./main
          gh api "$ARTIFACT_URL" > ./main/bench.zip
          unzip -o ./main/bench.zip -d ./main
          echo "found=true" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: benchstat compare
        if: steps.baseline.outputs.found == 'true'
        run: |
          set -euo pipefail
          # Strict positive filter: keep only lines benchstat can parse.
          # The naive negative grep (^2026/ | ^goose:) leaked because
          # `go test` re-merges the child binary's stderr onto its own
          # stdout, so goose-log lines arrive concatenated mid-row:
          #   "BenchmarkInsertEntry-4   2026/06/11 12:37 OK 0001_*.sql"
          # Those start with `Benchmark` so the negative grep didn't
          # catch them, and benchstat died with
          #   "./main/bench.txt:19: parsing iteration count: invalid syntax".
          # Strict pattern: a real bench row is
          #   Benchmark<name>-<P>  <iters>  <ns>  ns/op  ...
          # i.e. /^Benchmark[A-Za-z0-9_/]+-\d+\s+\d+\s+\d+(\.\d+)?\s+ns\/op/.
          # Headers and outcome lines are also kept verbatim.
          FILTER='^(goos:|goarch:|pkg:|cpu:|Benchmark[A-Za-z0-9_/]+-[0-9]+[[:space:]]+[0-9]+[[:space:]]+[0-9]+(\.[0-9]+)?[[:space:]]+ns/op|PASS|FAIL|ok[[:space:]])'
          grep -E "$FILTER" ./main/bench.txt > ./main/bench-clean.txt
          grep -E "$FILTER" ./pr/bench.txt   > ./pr/bench-clean.txt
          echo "=== main/bench-clean.txt (first 30 lines) ==="
          head -30 ./main/bench-clean.txt
          echo "=== pr/bench-clean.txt (first 30 lines) ==="
          head -30 ./pr/bench-clean.txt
          benchstat ./main/bench-clean.txt ./pr/bench-clean.txt | tee /tmp/diff.txt
          # Regression threshold: >15% delta.
          #
          # The previous 5% threshold was too tight for shared GitHub
          # Actions runners (AMD EPYC). Empirically, the same commit
          # run twice can drift 5–15% on CPU-bound benchmarks (e.g.
          # BenchmarkBuild_500nodes_5lanes-4) purely from runner /
          # neighbor variance — this PR is a YAML-only change that was
          # flagged at +12.98%, proof the gate measured noise not code.
          #
          # 15% accepts the noise floor while still catching real
          # algorithmic regressions (a doubled hot loop is +100%, a
          # missing index falls to N+1 quadratic). Tighten back to 5%
          # when we move benchmarks to a dedicated/larger runner.
          if awk '
            /^geomean/ { next }
            $0 ~ /[[:space:]]\+[0-9]+(\.[0-9]+)?%/ {
              for (i = 1; i <= NF; i++) {
                if ($i ~ /^\+[0-9]/) {
                  d = $i + 0
                  if (d > 15) { print "REGRESSION: " $0; exit 1 }
                }
              }
            }
          ' /tmp/diff.txt; then
            echo "OK — no significant regressions > 15%"
          else
            echo "FAIL — one or more benchmarks regressed > 15%"
            exit 1
          fi

      - name: no baseline yet (bootstrap)
        if: steps.baseline.outputs.found != 'true'
        run: |
          echo "::notice::No main baseline artifact yet. This run records the first one."
          echo "Compare will activate on the next PR after this one merges."
          cat ./pr/bench.txt
