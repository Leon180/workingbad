name: CodeQL

# Static analysis for Go. Findings appear in the Security tab; the workflow
# also fails CI on `error`-severity alerts so high-impact issues block merge.
#
# Schedule keeps the database fresh even if main is dormant (GitHub's
# scanner improves over time, so a 7-day re-scan catches issues that
# weren't detectable on the original commit).

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '23 4 * * 1' # Mondays 04:23 UTC (off-peak)

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: CodeQL (go)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3
        with:
          languages: go
          # security-and-quality is broader than the default `security`;
          # picks up correctness smells (nil deref, ignored errors etc.)
          # alongside the security ruleset.
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3
        with:
          category: '/language:go'
