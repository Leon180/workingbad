name: CodeQL

# Static analysis for Go. Findings appear in the Security tab; the workflow
# also fails CI on `error`-severity alerts so high-impact issues block merge.
#
# Schedule keeps the database fresh even if main is dormant (GitHub's
# scanner improves over time, so a 7-day re-scan catches issues that
# weren't detectable on the original commit).

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    - cron: '23 4 * * 1' # Mondays 04:23 UTC (off-peak)

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: CodeQL (go)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b0c4fd77f6c559021d78430ec4d0d169ae74a4eb # v3
        with:
          languages: go
          # security-and-quality is broader than the default `security`;
          # picks up correctness smells (nil deref, ignored errors etc.)
          # alongside the security ruleset.
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@b0c4fd77f6c559021d78430ec4d0d169ae74a4eb # v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b0c4fd77f6c559021d78430ec4d0d169ae74a4eb # v3
        with:
          category: '/language:go'
