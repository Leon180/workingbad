name: Auto-Retro

# Process model: every N merged PRs to main, open a retro issue
# prefilled with the window's PR list. The retro itself is reviewed by
# the user; what falls out (decisions, follow-up actions) becomes the
# next cycle's inputs.
#
# N tuning history:
#  - 2026-06-09 first set: N=3 ("small enough to remember context").
#  - 2026-06-11 retro #64: raised to N=10. At our actual cadence
#    (~10-12 PRs/day during build-out) N=3 was opening retros faster
#    than humans could write them. Six retros stacked up unfilled and
#    we closed them all when consolidating to one window retro.
#    N=10 is a better signal-to-noise tradeoff for this phase.

on:
  pull_request:
    types: [closed]
    branches: [main]
  # Manual trigger so we can run a retro on-demand mid-window.
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  maybe-open-retro:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: count PRs since last retro and open new one if N reached
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const RETRO_WINDOW = 10;

            // 1. Find the most recent retro issue (closed or open).
            //    Use it as the start-of-window marker.
            const retros = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'retro',
              state: 'all',
              sort: 'created',
              direction: 'desc',
              per_page: 1,
            });
            const windowStart = retros.data.length > 0
              ? retros.data[0].created_at
              : '1970-01-01T00:00:00Z';
            core.info(`window start: ${windowStart}`);

            // 2. List all PRs merged into main since the window start.
            //    The search API is the cheapest way: filter by base + merged.
            const q = `repo:${context.repo.owner}/${context.repo.repo} is:pr is:merged base:main merged:>${windowStart}`;
            const merged = await github.rest.search.issuesAndPullRequests({
              q,
              sort: 'created',
              order: 'asc',
              per_page: 100,
            });
            core.info(`merged PRs in window: ${merged.data.total_count}`);

            const mergedPrs = merged.data.items;
            if (mergedPrs.length < RETRO_WINDOW && context.eventName !== 'workflow_dispatch') {
              core.info(`only ${mergedPrs.length} PRs merged; need ${RETRO_WINDOW}`);
              return;
            }

            // 3. Build the retro body. Group by epic label where possible.
            const lines = [
              '## Window',
              '',
              `Since: ${windowStart}`,
              `Count: ${mergedPrs.length} merged PR(s)`,
              '',
              '### PRs in this window',
              '',
              ...mergedPrs.map(pr =>
                `- #${pr.number} **${pr.title}** ` +
                `(${pr.labels.map(l => '`' + l.name + '`').join(' ') || '_no-label_'})`
              ),
              '',
              '## ① What landed (action / activity)',
              '',
              '_Auto-list above; brief grouping by epic if useful._',
              '',
              '## ② What worked',
              '',
              '_Pattern or workflow worth keeping._',
              '',
              '## ③ What hurt',
              '',
              '_What slowed us down or caused rework — cite PRs / commits._',
              '',
              '## ④ What to do differently',
              '',
              '_Concrete change for the next cycle. Each item → follow-up issue or `decision` entry._',
              '',
              '## ⑤ Carry-overs',
              '',
              '_Issues / questions the next cycle inherits._',
            ];

            const today = new Date().toISOString().slice(0, 10);
            const title = `retro: ${today} (${mergedPrs.length} PRs)`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: lines.join('\n'),
              labels: ['retro'],
            });
            core.notice(`opened retro for window ${windowStart} → now (${mergedPrs.length} PRs)`);
